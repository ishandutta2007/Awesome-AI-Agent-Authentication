<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d17"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.4; }
      50% { transform: scale(1.15) translate(-10px, 15px); opacity: 0.7; }
    }
    @keyframes rotateRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes dashMove {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -40; }
    }
    .orb1 {
      animation: pulseOrb 6s ease-in-out infinite;
      transform-origin: 850px 80px;
    }
    .orb2 {
      animation: pulseOrb 8s ease-in-out infinite reverse;
      transform-origin: 150px 200px;
    }
    .ring {
      animation: rotateRing 20s linear infinite;
      transform-origin: 850px 130px;
    }
    .animated-line {
      stroke-dasharray: 10, 10;
      animation: dashMove 3s linear infinite;
    }
    .title-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: url(#titleGradient);
    }
    .subtitle-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 500;
      font-size: 18px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
    }
  </style>

  <!-- Base Card Background -->
  <rect width="1000" height="260" rx="16" fill="url(#bgGradient)"/>
  <rect width="998" height="258" x="1" y="1" rx="15" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Dynamic Background Orbs -->
  <circle class="orb1" cx="850" cy="80" r="120" fill="#6366f1" opacity="0.3" filter="url(#glow)"/>
  <circle class="orb2" cx="150" cy="200" r="100" fill="#0ea5e9" opacity="0.25" filter="url(#glow)"/>

  <!-- Dynamic Tech Ring & Grid (Right Background) -->
  <g class="ring" opacity="0.25">
    <circle cx="850" cy="130" r="80" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6, 6"/>
    <circle cx="850" cy="130" r="105" fill="none" stroke="#818cf8" stroke-width="1" stroke-dasharray="12, 8"/>
  </g>

  <!-- Network Connection Lines -->
  <path class="animated-line" d="M 50,40 L 950,40" stroke="#334155" stroke-width="1" opacity="0.5"/>
  <path class="animated-line" d="M 50,220 L 950,220" stroke="#334155" stroke-width="1" opacity="0.5"/>

  <!-- Shield / Security Icon (Left Foreground side) -->
  <g transform="translate(60, 75)">
    <rect width="64" height="64" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" filter="url(#glow)"/>
    <path d="M 32 18 L 48 24 V 36 C 48 46 32 52 32 52 C 32 52 16 46 16 36 V 24 Z" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 27 33 L 31 37 L 38 29" fill="none" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Main Foreground Content -->
  <g transform="translate(145, 82)">
    <!-- Category Pill -->
    <rect width="210" height="26" rx="13" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="105" y="17" text-anchor="middle" class="badge-text">⚡ AI AGENT SECURITY &amp; IAM</text>

    <!-- Main Title -->
    <text x="0" y="65" class="title-text">Awesome AI Agent Authentication</text>

    <!-- Subtitle -->
    <text x="0" y="98" class="subtitle-text">Curated CIAM, Machine Identity, OAuth for Agents, Passkeys &amp; Workload Auth</text>
  </g>
</svg>
